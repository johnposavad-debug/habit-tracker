<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>John's Habit Tracker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>John's Habit Tracker</h1>

  <button id="side-prev" class="side-arrow" aria-label="Previous day">&#8249;</button>
  <button id="side-next" class="side-arrow" aria-label="Next day">&#8250;</button>

  <div class="date-nav">
    <button id="top-prev" aria-label="Previous day">&#8249;</button>
    <span id="date-display"></span>
    <button id="top-next" aria-label="Next day">&#8250;</button>
  </div>

  <label class="habit">
    <input type="checkbox" id="early-walk">
    Early walk
  </label>

  <script src="script.js"></script>
</body>
</html>
